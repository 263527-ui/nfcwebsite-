<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 노래 뽑기</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;900&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ffd166;
    --ink: #fff;
    --ink-dim: rgba(255,255,255,.78);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: #0b0b14; }
  body {
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .bg { position: fixed; inset: 0; z-index: 0; transition: opacity 1.4s ease; }
  #bgB { opacity: 0; }
  .shade { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 0%, rgba(0,0,0,.28) 100%),
                linear-gradient(to top, rgba(0,0,0,.35), rgba(0,0,0,0) 50%); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

  main {
    position: relative; z-index: 2;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1.25rem 5rem;
    text-align: center;
  }
  .count { position: fixed; top: calc(env(safe-area-inset-top, 0px) + .9rem); right: 1.1rem; z-index: 3;
    font-size: .85rem; font-weight: 300; color: var(--ink-dim); }

  .stage { width: 100%; max-width: 34rem; min-height: 22rem; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* 뽑기 머신 */
  .machine { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; width: min(15rem, 62vw); display: block; }
  .machine[disabled] { cursor: default; }
  .machine svg { width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 18px 30px rgba(0,0,0,.4)); }
  .machine:focus-visible { outline: 3px solid #fff; outline-offset: 6px; border-radius: 20px; }
  .bodyfill { fill: var(--accent); transition: fill 1s ease; }
  .machine:not(.busy):hover svg { animation: wobble .6s ease-in-out; }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-1.5deg); } 75% { transform: rotate(1.5deg); } }
  .machine:not(.busy) .knob { animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 0%,68%,100% { transform: rotate(0); } 80% { transform: rotate(50deg); } 90% { transform: rotate(-25deg); } }
  .machine.cranking .knob { animation: crank .8s linear infinite; }
  @keyframes crank { to { transform: rotate(360deg); } }
  .machine.cranking .cap { animation: jiggle .32s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes jiggle { 0%,100% { transform: translate(0,0) rotate(0); } 25% { transform: translate(4px,-9px) rotate(16deg); } 50% { transform: translate(-4px,5px) rotate(-12deg); } 75% { transform: translate(5px,2px) rotate(8deg); } }
  .machine.cranking svg { animation: shake .22s linear infinite; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  .dropcap { opacity: 0; }
  .machine.dropping .dropcap { animation: drop .85s cubic-bezier(.5,0,.9,.6) both; }
  @keyframes drop { 0% { transform: translateY(-58px); opacity: 0; } 12% { opacity: 1; } 62% { transform: translateY(0); opacity: 1; } 80% { transform: translateY(-13px); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
  .flash { opacity: 0; }
  .machine.open .dropcap { animation: none; opacity: 1; }
  .machine.open .capTop { animation: topOff .7s ease-out both; }
  .machine.open .capBot { animation: botOff .7s ease-out both; }
  .machine.open .flash { animation: flash .7s ease-out both; }
  @keyframes topOff { to { transform: translate(-18px,-40px) rotate(-40deg); opacity: 0; } }
  @keyframes botOff { to { transform: translate(18px,12px) rotate(35deg); opacity: 0; } }
  @keyframes flash { 0% { opacity: .95; transform: scale(.2); } 100% { opacity: 0; transform: scale(3.6); } }
  .intro { margin: 1.6rem 0 0; font-weight: 300; color: var(--ink-dim); font-size: 1rem; }

  /* 뽑는 중 */
  .roll { min-height: 9rem; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .roll[hidden] { display: none; }
  .roll .a { font-weight: 300; font-size: 1rem; color: var(--ink-dim); }
  .roll .t { font-weight: 900; font-size: clamp(1.8rem, 7vw, 2.8rem); line-height: 1.2; margin-top: .3rem; filter: blur(1.5px); }

  /* 결과 */
  .result { display: none; flex-direction: column; align-items: center; }
  .result.on { display: flex; animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
  .artist { font-weight: 500; font-size: 1.1rem; color: var(--accent); text-shadow: 0 1px 12px rgba(0,0,0,.4); }
  .title { margin: .35rem 0 0; font-weight: 900; font-size: clamp(2.1rem, 9vw, 3.6rem); line-height: 1.15; word-break: keep-all; text-shadow: 0 2px 24px rgba(0,0,0,.45); }
  .mood { margin-top: 1.1rem; padding: .35rem 1rem; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); font-size: .95rem; font-weight: 500; background: rgba(0,0,0,.18); }
  .desc { margin: 1.4rem 0 0; max-width: 28rem; font-weight: 300; font-size: 1.08rem; line-height: 1.85; color: #fff; text-shadow: 0 1px 14px rgba(0,0,0,.5); word-break: keep-all; }
  .again { margin-top: 2rem; appearance: none; cursor: pointer; border: 1px solid rgba(255,255,255,.7); background: rgba(0,0,0,.2); color: #fff;
    font: 500 1rem "Noto Sans KR", sans-serif; padding: .7rem 1.6rem; border-radius: 999px; transition: background .2s, color .2s; }
  .again:hover { background: #fff; color: #111; }
  .again:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* 기록 */
  .history { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    padding: .7rem 1rem calc(env(safe-area-inset-bottom, 0px) + .7rem);
    display: flex; gap: .5rem; overflow-x: auto; background: linear-gradient(to top, rgba(0,0,0,.45), transparent); }
  .history:empty { display: none; }
  .chip { flex: 0 0 auto; appearance: none; cursor: pointer; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.3); color: #fff;
    font: 300 .8rem "Noto Sans KR", sans-serif; padding: .35rem .8rem; border-radius: 999px; white-space: nowrap; }
  .chip:hover, .chip.cur { border-color: var(--accent); color: var(--accent); }

  @media (prefers-reduced-motion: reduce) { .machine, .machine * { animation: none !important; } .result.on { animation: none; } .bg { transition: none; } }

  .boot{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:bootOut 2.6s ease forwards}
  .boot::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.4),transparent 55%);opacity:0;animation:bloom 2.2s ease forwards}
  .bootT{position:relative;z-index:1;font:900 1.6rem "Noto Sans KR",sans-serif;letter-spacing:.2em;color:#fff;opacity:0;text-shadow:0 0 30px #fff;animation:bootT 2.2s ease forwards}
  @keyframes bootOut{0%,55%{opacity:1}100%{opacity:0;visibility:hidden}}
  @keyframes bootT{0%{opacity:0;filter:blur(8px)}35%{opacity:1;filter:blur(0)}70%{opacity:1}100%{opacity:0}}
  @keyframes bloom{0%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
  @keyframes mainIn{from{opacity:0;filter:brightness(.2)}to{opacity:1;filter:none}}
  main{animation:mainIn 1.5s 1.3s both}
  .bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + .7rem);left:.8rem;z-index:5;display:flex;gap:.4rem}
  .tb,.fc,.act{appearance:none;cursor:pointer;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.3);color:#fff;font:500 .82rem "Noto Sans KR",sans-serif;padding:.4rem .85rem;border-radius:999px;text-decoration:none;display:inline-block}
  .fc.on,.tb:hover,.act:hover{background:var(--accent);color:#1a1020;border-color:var(--accent)}
  .filters{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;max-width:34rem;margin:2.6rem 0 1.2rem}
  .brk{flex-basis:100%;height:0}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1.4rem}
  .modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:1rem}
  .modal[hidden]{display:none}
  .box{width:100%;max-width:34rem;max-height:84vh;overflow:auto;background:#16162a;border-radius:18px;padding:1.2rem;text-align:left;font-size:.95rem}
  .box h2{margin:0 0 .8rem;font-size:1.15rem}
  .box input[type=text]{width:100%;padding:.55rem .8rem;margin:.25rem 0;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font:inherit}
  .row{display:flex;gap:.6rem;align-items:center;padding:.35rem 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .post{padding:.6rem 0;border-bottom:1px solid rgba(255,255,255,.1);line-height:1.6}
  .post a{color:var(--accent)}
  .cl{float:right}
  .toast{position:fixed;left:50%;bottom:4.5rem;transform:translateX(-50%);z-index:30;background:rgba(0,0,0,.8);padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .3s}
  .toast.on{opacity:1}
  @media (prefers-reduced-motion: reduce){.boot{animation-duration:.6s}.boot::after,.bootT{animation:none}main{animation:none}}
</style>
</head>
<body>
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div class="shade"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="boot" id="boot"><div class="bootT">오늘의 노래</div></div>
  <div class="bar"><button class="tb" id="snd" type="button" aria-label="소리 켜기/끄기">🔊</button><button class="tb" id="openMy" type="button">내 리스트</button><button class="tb" id="openBd" type="button">게시판</button></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="count" id="count"></div>

  <main>
    <div class="filters" id="filters"></div>
    <div class="stage">
      <button class="machine" id="pick" type="button" aria-label="뽑기 시작: 손잡이 돌리기">
        <svg viewBox="0 0 240 330" aria-hidden="true">
          <circle cx="120" cy="100" r="80" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.55)" stroke-width="3"/>
          <g id="caps"></g>
          <path d="M62 66 A64 64 0 0 1 98 36" stroke="rgba(255,255,255,.75)" stroke-width="5" stroke-linecap="round" fill="none"/>
          <rect class="bodyfill" x="42" y="168" width="156" height="140" rx="20"/>
          <rect x="42" y="168" width="156" height="28" rx="14" fill="rgba(0,0,0,.2)"/>
          <rect x="76" y="204" width="88" height="54" rx="12" fill="rgba(0,0,0,.28)"/>
          <g transform="translate(120 231)"><g class="knob">
            <circle r="19" fill="#fff"/>
            <rect x="-4" y="-23" width="8" height="27" rx="4" fill="#2b2b3a"/>
            <circle r="5" fill="#2b2b3a"/>
          </g></g>
          <rect x="82" y="268" width="76" height="34" rx="10" fill="rgba(0,0,0,.55)"/>
          <g transform="translate(120 285)"><g class="dropcap">
            <g class="capTop"><path d="M-15 0 A15 15 0 0 1 15 0Z" fill="#ffd166"/></g>
            <g class="capBot"><path d="M-15 0 A15 15 0 0 0 15 0Z" fill="#ffffff"/></g>
            <circle class="flash" r="30" fill="#fff"/>
          </g></g>
        </svg>
      </button>
      <p class="intro" id="intro">손잡이를 눌러 오늘의 노래를 뽑아 보세요</p>

      <div class="roll" id="roll" hidden aria-live="polite">
        <div class="a" id="rollA"></div>
        <div class="t" id="rollT"></div>
      </div>

      <div class="result" id="result">
        <div class="artist" id="rArtist"></div>
        <h1 class="title" id="rTitle"></h1>
        <div class="mood" id="rMood"></div>
        <p class="desc" id="rDesc"></p>
        <div class="acts"><a class="act" id="yt" target="_blank" rel="noopener">▶ 유튜브로 미리듣기</a><button class="act" id="fav" type="button">♡ 즐겨찾기</button><button class="act" id="toBd" type="button">📌 게시판에 공유</button></div>
        <button class="again" id="again" type="button">다시 뽑기</button>
      </div>
    </div>
  </main>

  <div class="modal" id="myModal" hidden><div class="box"><button class="tb cl" data-close type="button">닫기</button>
    <h2>내 리스트 <small id="myCnt"></small></h2>
    <input type="text" id="cA" placeholder="아티스트" maxlength="40"><input type="text" id="cT" placeholder="곡 제목" maxlength="60">
    <button class="act" id="cAdd" type="button" style="margin:.4rem 0 .8rem">＋ 직접 추가</button>
    <input type="text" id="mySearch" placeholder="곡 검색" maxlength="40"><div id="myList"></div></div></div>
  <div class="modal" id="bdModal" hidden><div class="box"><button class="tb cl" data-close type="button">닫기</button>
    <h2>친구 공유 게시판</h2><div id="bdSong" style="color:var(--accent);margin-bottom:.5rem"></div>
    <input type="text" id="bdName" placeholder="닉네임" maxlength="12"><input type="text" id="bdMsg" placeholder="한마디 (80자)" maxlength="80">
    <button class="act" id="bdPost" type="button" style="margin:.4rem 0 .8rem">뽑은 곡 올리기</button>
    <div id="boardMsg" style="opacity:.7"></div><div id="bdList"></div></div></div>
  <div class="history" id="history"></div>

<script>
(function () {
  /* [아티스트, 제목, 효과, 배경색1, 배경색2, 포인트색, 분위기, 설명] */
  var SONGS = [
    ["소연","퇴사할게여","confetti","#1b2a4a","#3b6ea8","#ffd54a","속 시원한 해방감","제목 그대로 퇴사를 선언하는 통쾌한 곡이에요. 출근길의 답답함이 한 번에 풀리는 것 같은 가벼운 기분을 줘요."],
    ["RESCENE","LOVE ATTACK","hearts","#4a1140","#c2305f","#ffb3d1","두근거림","갑자기 밀려오는 설렘에 심장이 먼저 반응하는 순간을 담은 상큼한 곡이에요."],
    ["I.O.I","갑자기","sparkle","#2a1a5e","#5b6cff","#ffd1f0","산뜻한 설렘","예고 없이 찾아온 감정에 어쩔 줄 모르는 마음을 통통 튀게 그려요."],
    ["RESCENE","Deja Vu","pulse","#10133a","#5b2a9e","#9ff3ff","몽환","어디선가 본 듯한 장면과 사람에게 끌리는 신비로운 분위기의 곡이에요."],
    ["CORTIS","REDRED","embers","#3a0a0a","#c0281c","#ff9a7a","붉은 에너지","붉은 에너지가 터져 나오는 강렬한 비트의 곡이에요. 가만히 듣기가 어려워요."],
    ["Taylor Swift","Cruel Summer","fireflies","#2b1055","#d6416b","#ffd27a","한여름 밤의 아슬아슬함","뜨거운 여름밤의 아슬아슬한 감정을 몰아치듯 달려가는 팝 트랙이에요. 후반부로 갈수록 벅차올라요."],
    ["Yuuri","BETELGEUSE","stars","#070612","#4a0f2a","#ff6a45","담담한 이별","끝난 사랑을 밤하늘의 붉은 별에 겹쳐 보는 노래예요. 크게 소리치지 않고 조용히 그리워하는 온도가 좋아요."],
    ["Hearts2Hearts","STYLE","sparkle","#182a4a","#5a8fe0","#ffffff","산뜻한 자신감","나만의 스타일로 가볍게 걸어가는 청량한 무드의 곡이에요."],
    ["aespa","Whiplash","pulse","#0a0a1a","#4b00d6","#00f0ff","사이버 카리스마","채찍처럼 휘몰아치는 리듬과 어두운 사이버 감성이 매력적인 곡이에요."],
    ["ROSÉ","APT.","confetti","#3a0d1e","#e0295a","#ffe14a","파티 에너지","한 번 들으면 후렴이 머릿속에서 떠나지 않는, 게임처럼 신나는 파티 송이에요."],
    ["BTS","Dynamite","confetti","#1a1240","#e0700a","#ffe066","눈부신 여름","디스코 바이브로 기분을 확 끌어올리는 밝고 눈부신 팝이에요."],
    ["BTS","Butter","sparkle","#2a1c05","#b8860b","#fff3b0","부드러운 자신감","버터처럼 매끄럽고 여유 있는 펑키 팝이에요. 듣는 순간 분위기가 반짝여요."],
    ["IVE","REBEL HEART","embers","#1a1035","#c81e55","#ffb0c8","반항적인 마음","규칙에 얌전히 따르지 않는 마음을 당당하게 선언하는 곡이에요."],
    ["IVE","LOVE DIVE","bubbles","#06264a","#2b7be0","#ffd1f7","도도한 몽환","사랑 속으로 깊이 뛰어드는 도도하고 몽환적인 분위기의 곡이에요."],
    ["NewJeans","Hype Boy","sparkle","#16324a","#3fa0c0","#ffffff","청량한 설렘","가볍고 청량하게 마음을 두드리는 사랑스러운 곡이에요."],
    ["NewJeans","Ditto","snow","#0f2a44","#6fa0d8","#ffffff","아련한 겨울","겨울 교실 창가 같은 아련하고 몽글몽글한 분위기의 곡이에요."],
    ["NewJeans","Super Shy","hearts","#3a1b4f","#e0609f","#ffd6ea","수줍은 두근거림","말을 걸고 싶은데 수줍어서 망설이는 마음을 귀엽게 풀어냈어요."],
    ["aespa","Supernova","stars","#07071a","#4b1fa8","#ff7bd5","폭발하는 별","별이 폭발하듯 압도적으로 터지는 에너지가 느껴지는 곡이에요."],
    ["aespa","Drama","pulse","#22081f","#a3125e","#ffb03a","무대 위 드라마","한 편의 드라마처럼 긴장감 있게 전개되는 강렬한 곡이에요."],
    ["LE SSERAFIM","ANTIFRAGILE","embers","#150f2a","#7a1fa2","#ffd166","단단한 자신감","부서지기보다 오히려 더 단단해지는 마음을 힘 있게 그려요."],
    ["LE SSERAFIM","Perfect Night","sparkle","#0d1330","#2d3fa8","#c8b6ff","반짝이는 도시의 밤","완벽한 밤을 즐기는 사람들의 반짝이는 도시 무드가 담겨 있어요."],
    ["ILLIT","Magnetic","pulse","#1a1d3a","#5d6bff","#ffc4e6","자석 같은 끌림","자석처럼 끌리는 마음을 귀엽고 경쾌하게 표현한 곡이에요."],

  function draw() {
    if (busy) return;
    if (!pool().length) { toast(mode === 'all' ? '이 분위기에 맞는 곡이 없어요' : '고른 곡이 없어요. 먼저 내 리스트나 ♥를 채워 주세요'); return; }
    busy = true; ac();
    if (!bag.length) { shuffleBag(); drawn = []; }
    var pickIdx = bag.pop();
    drawn.push(pickIdx); updateCount();
    var m = $('pick');
    $('result').classList.remove('on'); $('intro').style.display = 'none';
    m.style.display = 'block'; m.disabled = true; m.className = 'machine busy cranking';
    var roll = $('roll'); roll.hidden = false;
    var steps = reduce ? 4 : 16, i = 0;
    (function step() {
      if (i < steps) {
        var rnd = SONGS[Math.floor(Math.random() * SONGS.length)];
        $('rollA').textContent = rnd[0]; $('rollT').textContent = rnd[1]; sTick();
        var delay = 60 + Math.pow(i / steps, 2.2) * 400;
        i++; setTimeout(step, delay);
      } else {
        $('rollT').style.filter = 'none';
        $('rollA').textContent = SONGS[pickIdx][0]; $('rollT').textContent = SONGS[pickIdx][1];
        m.className = 'machine busy dropping'; sThud();
        setTimeout(function () {
          m.className = 'machine busy dropping open'; sDing();
          setTimeout(function () {
            busy = false; m.disabled = false; m.className = 'machine'; $('rollT').style.filter = '';
            showResult(pickIdx, true);
          }, reduce ? 100 : 750);
        }, reduce ? 100 : 950);
      }
    })();
  }

  /* ---------- 필터 / 내 리스트 / 즐겨찾기 / 게시판 ---------- */
  function chip(t, on, fn) { var b = document.createElement('button'); b.type = 'button'; b.className = 'fc' + (on ? ' on' : ''); b.textContent = t; b.onclick = fn; return b; }
  function renderFilters() {
    var f = $('filters'); f.innerHTML = '';
    [['all', '전체'], ['my', '내 리스트'], ['fav', '♥ 즐겨찾기']].forEach(function (m) { f.appendChild(chip(m[1], mode === m[0], function () { mode = m[0]; shuffleBag(); renderFilters(); })); });
    var br = document.createElement('div'); br.className = 'brk'; f.appendChild(br);
    ['🌈 모든 분위기', '😢 슬픈', '🎉 신나는', '💗 설레는', '🌙 몽환', '🔥 강렬', '☕ 따뜻'].forEach(function (n, i) { f.appendChild(chip(n, theme === i - 1, function () { theme = i - 1; shuffleBag(); renderFilters(); })); });
  }
  function renderMy() {
    var q = $('mySearch').value.trim().toLowerCase(), box = $('myList'); box.innerHTML = '';
    SONGS.forEach(function (s, i) {
      var k = key(i); if (q && (s[0] + ' ' + s[1]).toLowerCase().indexOf(q) < 0) return;
      var l = document.createElement('label'), c = document.createElement('input'), sp = document.createElement('span');
      l.className = 'row'; c.type = 'checkbox'; c.checked = MY.indexOf(k) > -1;
      c.onchange = function () { var p = MY.indexOf(k); if (c.checked && p < 0) MY.push(k); if (!c.checked && p > -1) MY.splice(p, 1); sv('my', MY); $('myCnt').textContent = MY.length + '곡'; shuffleBag(); };
      sp.textContent = s[0] + ' - ' + s[1]; l.appendChild(c); l.appendChild(sp); box.appendChild(l);
    });
    $('myCnt').textContent = MY.length + '곡';
  }
  function openM(id) { $(id).hidden = false; }
  document.querySelectorAll('.modal').forEach(function (m) { m.addEventListener('click', function (e) { if (e.target === m || e.target.hasAttribute('data-close')) m.hidden = true; }); });
  $('openMy').onclick = function () { renderMy(); openM('myModal'); };
  $('mySearch').oninput = renderMy;
  $('cAdd').onclick = function () {
    var a = $('cA').value.trim(), t = $('cT').value.trim(); if (!a || !t) { toast('아티스트와 제목을 모두 적어 주세요'); return; }
    var k = a + '|' + t, i = -1; SONGS.forEach(function (x, n) { if (x[0] + '|' + x[1] === k) i = n; });
    if (i < 0) { CUST.push([a, t]); sv('cust', CUST); addCust(a, t); }
    if (MY.indexOf(k) < 0) MY.push(k); sv('my', MY); $('cA').value = ''; $('cT').value = ''; renderMy(); shuffleBag(); toast('내 리스트에 담았어요');
  };
  $('fav').onclick = function () { var k = key(current), p = FAV.indexOf(k); if (p > -1) FAV.splice(p, 1); else FAV.push(k); sv('fav', FAV); favBtn(); shuffleBag(); };
  $('snd').onclick = function () { snd = !snd; this.textContent = snd ? '🔊' : '🔇'; if (snd) { ac(); sTick(); } };

  var DB = null;
  function boardSong() { $('bdSong').textContent = current > -1 ? '올릴 곡: ' + SONGS[current][0] + ' - ' + SONGS[current][1] : '먼저 노래를 뽑으면 여기에 올릴 수 있어요'; }
  $('openBd').onclick = function () { boardSong(); openM('bdModal'); };
  $('toBd').onclick = function () { boardSong(); openM('bdModal'); };
  function renderBoard(rows) {
    var b = $('bdList'); b.innerHTML = ''; if (!rows.length) { b.textContent = '아직 글이 없어요. 첫 글을 남겨 보세요!'; return; }
    rows.forEach(function (r) {
      var d = document.createElement('div'), h = document.createElement('b'), p = document.createElement('div'), a = document.createElement('a');
      d.className = 'post'; h.textContent = '🎵 ' + String(r.a || '').slice(0, 60) + ' - ' + String(r.s || '').slice(0, 80);
      p.textContent = String(r.n || '익명').slice(0, 12) + (r.m ? ': ' + String(r.m).slice(0, 80) : '');
      a.textContent = '▶ 들어보기'; a.target = '_blank'; a.rel = 'noopener'; a.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(String(r.a || '') + ' ' + String(r.s || ''));
      d.appendChild(h); d.appendChild(p); d.appendChild(a); b.appendChild(d);
    });
  }
  if (window.claude && claude.use) {
    claude.use('db').then(function (d) {
      DB = d; if (!d) { $('boardMsg').textContent = '이 화면에서는 게시판을 쓸 수 없어요'; return; }
      d.collection('board').orderBy('t', 'desc').limit(30).onSnapshot(function (sn) { renderBoard(sn.docs.map(function (x) { return x.data(); })); },
        function () { $('boardMsg').textContent = '게시판을 불러오지 못했어요'; });
    }).catch(function () { $('boardMsg').textContent = '게시판을 쓸 수 없어요'; });
  } else { $('boardMsg').textContent = '이 화면에서는 게시판을 쓸 수 없어요'; }
  $('bdPost').onclick = function () {
    if (!DB) { toast('게시판을 쓸 수 없어요'); return; } if (current < 0) { toast('먼저 노래를 뽑아 주세요'); return; }
    var s = SONGS[current];
    DB.collection('board').add({ n: $('bdName').value.trim().slice(0, 12) || '익명', m: $('bdMsg').value.trim().slice(0, 80), a: s[0], s: s[1], t: Date.now() })
      .then(function () { $('bdMsg').value = ''; toast('게시판에 올렸어요!'); }).catch(function () { toast('글쓰기 권한이 없어요'); });
  };
  renderFilters();

  $('pick').addEventListener('click', draw);
  $('again').addEventListener('click', draw);
})();
</script>
</body>
</html>
